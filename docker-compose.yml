services:

  mariadb:
    image: mariadb:10.8

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mariadb-data:/var/lib/mysql

    networks:
      - erpnext-network

    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s


  redis:
    image: redis:alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    networks:
      - erpnext-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  frappe:
    build:
      context: .
      dockerfile: Dockerfile

    user: frappe

    working_dir: /home/frappe

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FRAPPE_ADMIN_PASSWORD: ${FRAPPE_ADMIN_PASSWORD}

      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:-erp.loc.test.waqf.gov.ly}
      FRAPPE_INTERNAL_PORT: ${FRAPPE_CONTAINER_PORT:-8800}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BACKUP_URL: ${S3_BACKUP_URL:-}

      SHELL: /bin/bash

    volumes:
      - .:/workspace
      - frappe-data:/home/frappe

    ports:
      # تم ربط المنافذ بملف .env لتجنب التعارض مع مشروعك الآخر
      - "${FRAPPE_HOST_PORT:-8801}:${FRAPPE_CONTAINER_PORT:-8800}"
      - "${SOCKETIO_HOST_PORT:-9001}:${SOCKETIO_CONTAINER_PORT:-9000}"

    networks:
      - erpnext-network

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


volumes:
  mariadb-data:
  redis-data:
  frappe-data:


networks:
  erpnext-network:
    driver: bridge
